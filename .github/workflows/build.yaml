name: Wails build

on:
  push:
    tags:
      # Match any new tag
      - '*'

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"

permissions:
    contents: write

jobs:
  build:
    strategy:

      fail-fast: false
      matrix:
        build:
          - name: 'epos-proxy-linux64'
            platform:  'linux/amd64'
            os: 'ubuntu-24.04'

          - name: 'epos-proxy-win64'
            platform:  'windows/amd64'
            os: 'windows-latest'

          # Disable automatic macOS builds for now as it's better to sign in a local environment
          # with the correct certificates and provisioning profiles.
          #- name: 'epos-proxy-macos-arm64'
          #  macos-app-name: 'ePOS proxy'
          #  platform:  'darwin/arm64'
          #  os: 'macos-latest'


    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Build wails
        uses: ./.github/actions
        id: build
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          macos-app-name: ${{ matrix.build.macos-app-name }}
          package: true
          go-version: '1.26.0'
          node-version: '22.20.0'
          token: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup GoLang
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Linux dependencies (for Wails asset generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libusb-1.0-0-dev gcc-aarch64-linux-gnu

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
        shell: bash

      - name: Install Wails CLI
        run: go install
        working-directory: vendor-patches/wails-v3/cmd/wails3
        shell: bash

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build Android APK
        run: task package:android ARCH=arm64
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epos-proxy-android-apk
          path: bin/epos-proxy.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bin/epos-proxy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
